name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Apply aimbot patch
        run: |
          git apply --check aimbot.patch
          git apply aimbot.patch

      - name: Fix upstream compile errors v4
        run: |
          M=src/Game/ProjectIGI.Game/Menus/MenuLayout.cs
          S=src/Game/ProjectIGI.Frontend/Screens/SettingsScreen.cs
          T=src/Game/ProjectIGI.Presentation/Hud/Remastered/Touch/TouchControls.cs
          sed -i 's/\bPanelTint\.Igi/MenuPanelTint.Igi/g' "$M"
          sed -i 's/crosshairColourBtn\.Activated += () =>/crosshairColourBtn.Activated += _ =>/' "$S"
          sed -i '1i using ProjectIGI.Game.Player;' "$S"
          sed -i '/float sdx = point.StartX - ComputerStickRest.X/,/return new Role(RoleKind.Stick, null);/ s/\bsd\([xy]\)\b/navD\1/g' "$T"
          grep -n "MenuPanelTint.Igi" "$M"
          grep -n "crosshairColourBtn.Activated" "$S"
          grep -n "navDx" "$T"
          if ! grep -q "crosshairColourBtn.Activated += _ =>" "$S"; then echo "FIX NOT APPLIED"; exit 1; fi
          if ! grep -q "float navDx" "$T"; then echo "FIX NOT APPLIED"; exit 1; fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Build .NET assemblies and copy them into the app
        run: |
          chmod +x deploy_managed_assets.sh
          ./deploy_managed_assets.sh

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: igi2-aimbot-apk
          path: app/android/app/build/outputs/apk/release/*.apk
